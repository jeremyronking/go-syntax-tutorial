<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GoTour — an interactive Go syntax & toolchain tutorial for experienced engineers." />
    <title>GoTour</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      // Default (no stored preference) is dark, matching the store default.
      try {
        var stored = JSON.parse(localStorage.getItem('gotour:v1:theme') || 'null');
        var theme = stored && stored.state && stored.state.theme;
        document.documentElement.classList.toggle('dark', theme !== 'light');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-ink-950 text-ink-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
