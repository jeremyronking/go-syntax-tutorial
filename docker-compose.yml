services:
  go-claude:
    build:
      context: ./go-claude
    image: go-claude:latest
    container_name: go-claude
    restart: unless-stopped
    ports:
      - "8181:8787"
    environment:
      PLAYGROUND_UPSTREAM: https://play.golang.org/compile

  go-gemini:
    build:
      context: ./go-gemini
    image: go-gemini:latest
    container_name: go-gemini
    restart: unless-stopped
    ports:
      - "8182:8787"
    environment:
      PLAYGROUND_UPSTREAM: https://play.golang.org/compile

  go-glm:
    build:
      context: ./go-glm
    image: go-glm:latest
    container_name: go-glm
    restart: unless-stopped
    ports:
      - "8183:8787"
    environment:
      PLAYGROUND_UPSTREAM: https://play.golang.org

  go-landing:
    build:
      context: .
      dockerfile: site/Dockerfile
    image: go-landing:latest
    container_name: go-landing
    restart: unless-stopped
    ports:
      - "8180:80"
