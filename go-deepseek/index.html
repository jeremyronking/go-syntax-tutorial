<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GoTour — an interactive Go syntax and toolchain tutorial for experienced engineers."
    />
    <title>GoTour — interactive Go syntax & toolchain</title>
    <script>
      try {
        if (localStorage.getItem('gotour:v1:theme') === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch (error) {
        // Storage can be blocked; the default dark theme applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
